<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<body>
    <div class="container">
        <!-- Yuqori o‘ng burchakdagi ikonkalar -->
        <div class="icons">
            <div class="icon search-icon">
                <i class="fas fa-search"></i>
            </div>
            <div class="icon dropdown-icon">
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>

        <!-- Sarlavha yoki filtr maydoni -->
        <div class="header">
            <input type="text" id="filterInput" placeholder="All List">
        </div>

        <!-- Vazifalar ro‘yxati -->
        <div class="task-list" id="taskList">
            <div class="task">
                <input type="checkbox" id="task1">
                <label for="task1">Kitob o‘qish</label>
            </div>
            <div class="task">
                <input type="checkbox" id="task2">
                <label for="task2">Xat yozish</label>
            </div>
            <div class="task">
                <input type="checkbox" id="task3">
                <label for="task3">Sport bilan shug‘ullanish</label>
            </div>
        </div>
    </div>

    <!-- Qo‘shish tugmasi -->
    <button class="add-btn" onclick="openModal()">+</button>

    <!-- Modal (vazifa qo‘shish uchun) -->
    <div class="modal" id="addTaskModal">
        <div class="modal-content">
            <h3>Yangi Vazifa Qo‘shish</h3>
            <input type="text" id="newTaskInput" placeholder="Vazifani kiriting">
            <button onclick="addTask()">Qo‘shish</button>
        </div>
    </div>

    <script>
        // Modalni ochish
        function openModal() {
            document.getElementById("addTaskModal").style.display = "flex";
        }

        // Modalni yopish (foydalanuvchi modal tashqarisiga bosganda)
        window.onclick = function(event) {
            const modal = document.getElementById("addTaskModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }

        // Vazifa qo‘shish
        function addTask() {
            const taskInput = document.getElementById("newTaskInput");
            const taskText = taskInput.value.trim();

            if (taskText === "") {
                alert("Iltimos, vazifa kiriting!");
                return;
            }

            const taskList = document.getElementById("taskList");
            const taskDiv = document.createElement("div");
            taskDiv.className = "task";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.id = "task" + (taskList.children.length + 1);

            const label = document.createElement("label");
            label.htmlFor = checkbox.id;
            label.textContent = taskText;

            taskDiv.appendChild(checkbox);
            taskDiv.appendChild(label);
            taskList.appendChild(taskDiv);

            // Modalni yopish va maydonni tozalash
            document.getElementById("addTaskModal").style.display = "none";
            taskInput.value = "";
        }
    </script>
</body>
